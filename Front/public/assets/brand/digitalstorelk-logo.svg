<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(4, 8)">
    <rect width="48" height="48" rx="14" fill="url(#logo-grad)" />
    <path d="M26 10L14 26H24L22 38L34 22H24L26 10Z" fill="white" filter="url(#glow)" />
  </g>

  <!-- Brand Typography -->
  <text x="62" y="35" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
    DIGITAL<tspan fill="#4F46E5">STORE</tspan>
  </text>
  
  <!-- LK Badge -->
  <g transform="translate(236, 17)">
    <rect width="36" height="22" rx="6" fill="url(#badge-grad)" />
    <text x="18" y="15" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
      LK
    </text>
  </g>

  <!-- Tagline Subtitle -->
  <text x="63" y="49" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1.2">
    SMART TOOLS • PREMIUM ACCESS
  </text>
</svg>
